services:
  hub:
    build:
      context: ./hub
    env_file: .env.hub
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - hub-data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.worker
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:
